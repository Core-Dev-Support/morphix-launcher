# Оптимизация памяти под ноутбук Asus X540NA (4 ГБ ОЗУ, Celeron/Pentium)
# Лимит памяти JVM: 768 МБ, быстрый параллельный сборщик мусора
org.gradle.jvmargs=-Xmx768m -XX:+UseParallelGC -XX:MaxMetaspaceSize=384m

# Быстрый инкрементальный кэш
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Оптимизация Kotlin: компиляция внутри процесса Gradle без спавна лишнего Kotlin Daemon (экономит ~500 МБ ОЗУ)
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process

# Современные флаги Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
android.overridePathCheck=true
